[project]
name = "jcce"
version = "0.1.0"
description = "Joint Causal Structure Learning, Classification, and Effect Estimation via Multi-Objective Optimization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pedro Cortes" }
]

dependencies = [
    # Core JAX stack
    "jax[cuda12]>=0.8.0",
    "flax>=0.12.0",
    "optax>=0.2.6",
    # Scientific computing
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    # Machine learning
    "scikit-learn>=1.3.0",
    # Graph utilities
    "networkx>=3.5",
    # Data handling
    "pandas>=2.3.0",
    "requests>=2.31.0",
    # Visualization
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    # Configuration
    "pyyaml>=6.0.0",
    # Progress bars
    "tqdm>=4.67.0",
    # Multi-objective optimization (counterfactual search)
    "pymoo>=0.6.0",
    # Hyperparameter optimization (Optuna outer loop)
    "optuna>=4.0.0",
    "thewalrus>=0.22.0",
    "grakel>=0.1.10",
    "econml>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "black>=25.9.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
